name: Simulation checks
on: [push, pull_request]
jobs:
  simulation:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: cmake -S Tests -B artifacts/tests
      - run: cmake --build artifacts/tests --config Release
      - run: ctest --test-dir artifacts/tests -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Tests -p "test_*.py"
